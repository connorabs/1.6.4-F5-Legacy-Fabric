# Gradle memory
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# ------------------------------------------------------------------
# Minecraft / Legacy Fabric toolchain versions
#
# yarn build number CONFIRMED via https://meta.legacyfabric.net/v2/versions
# as of when I put this together: build 604 was the highest available
# build for 1.6.4. Re-check before building in case a newer build has
# been published since - fetch
# https://meta.legacyfabric.net/v2/versions/yarn/1.6.4 (JSON) yourself.
# NOTE: this is the bare build NUMBER, not the full "1.6.4+build.604"
# string - legacy.yarn(minecraft_version, yarn_build) in build.gradle
# builds the full version string itself from these two pieces.
#
# loader_version is my best-effort guess, NOT independently confirmed
# against a live listing the way yarn_build was - see the note at the
# bottom of build.gradle for exactly where to check this before your
# first build.
# ------------------------------------------------------------------
minecraft_version=1.6.4
yarn_build=604
loader_version=0.16.10

# Legacy Fabric API submodule version (legacy-fabric-resource-loader-v1)
# NOTE: no longer used - kept commented for reference only. This mod has
# no Legacy Fabric API dependency at all; see build.gradle for why.
# fabric_resource_loader_version=2.2.0+1.6.4+052b56789e4f

# Mod properties
mod_version=1.0.0
maven_group=dev.example.omnilook
archives_base_name=omnilook-lite
